name: 同步模型价格

on:
  schedule:
    - cron: '17 */6 * * *'   # 每 6 小时
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/sync.mjs
      - name: 提交变化
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models.json
          git diff --staged --quiet || (git commit -m "data: 更新模型价格" && git push)
