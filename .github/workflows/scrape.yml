name: 同步模型价格

on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:

concurrency:
  group: pricing-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 同步官方价格
        run: npm run data:sync
      - name: 校验数据与构建
        run: npm run check
      - name: 提交价格变化
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pricing.json
          git diff --staged --quiet || git commit -m "data: sync official model pricing"
          git push
