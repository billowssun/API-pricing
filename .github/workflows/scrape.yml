name: 同步模型价格

on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:

concurrency:
  group: pricing-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 同步官方价格
        run: |
          npm test
          npm run data:sync
      - name: 写入同步摘要
        if: always()
        run: |
          node -e 'const fs = require("node:fs"); const s = JSON.parse(fs.readFileSync("sync-status.json", "utf8")); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## 模型同步诊断\n\n检查时间：" + s.checkedAt + "\n\n状态：" + s.status + "\n\n" + s.sources.map(x => "- " + x.name + ": " + x.status + (x.message ? " — " + x.message : "")).join("\n") + "\n");'
      - name: 上传同步诊断
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pricing-sync-status
          path: sync-status.json
          if-no-files-found: error
      - name: 校验数据与构建
        run: npm run check
      - name: 提交价格变化
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pricing.json sync-status.json
          git diff --staged --quiet || git commit -m "data: sync model catalog and pricing"
          git pull --rebase origin main
          git push origin HEAD:main
